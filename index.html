<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hawaiʻi Free Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same look as the site pages (kula-today/template.html). One card per site,
   each read from the site's own summary.json, listed in sites.json. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --ink: #17242f; --muted: #5a6b78; --rule: #d7e0e7;
  --sky: #2b67a8; --grass: #5f8a2e; --good: #3f7d2c; --warn: #a8661a; --fair: #5a6b78;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f171e; --surface: #16212b; --ink: #e4ecf2; --muted: #9aabb8; --rule: #2a3946;
    --sky: #7fb2ea; --grass: #9cc46a; --good: #8cc47a; --warn: #e3a45a; --fair: #9aabb8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 22px; }
.tag { font: 600 .72rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 2.1rem/1.05 var(--display); letter-spacing: .01em; margin: 0; }
.cards { display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 640px; }   /* one column, stacked (Sam) */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: grid; color: inherit; text-decoration: none; }
.card:hover { border-color: var(--sky); }
.card .top { font: 700 1.3rem/1.1 var(--display); padding: 12px 16px 10px; }
.card.soon { border-style: dashed; align-content: start; }
.card.soon:hover { border-color: var(--rule); }
.card img { width: 100%; height: auto; display: block; background: var(--rule); }   /* whole frame, captions and time stamp kept (Sam) */
.body { padding: 14px 16px 16px; display: grid; gap: 8px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h2 { font: 700 1.3rem/1.1 var(--display); margin: 0; }
.kind { font: 600 .72rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--grass); }
.chip { font: 600 .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.fair { color: var(--fair); }
.summary { margin: 0; font-size: .92rem; }
.when { font: .8rem var(--mono); color: var(--muted); }
.notes { font-size: .84rem; color: var(--muted); max-width: 75ch; }
.notes p { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Soaring briefings</div>
    <!-- The display font has no ʻokina (U+02BB) and a fallback glyph sat apart from the letters; the left quote stands in. -->
    <h1>Hawai‘i Free Flight</h1>
  </header>
  <div class="cards" id="cards"></div>
  <div class="notes">
    <p><strong>Notice.</strong> Information only, provided as is, with no guarantee of accuracy or availability. This is not an official forecast. Every pilot is responsible for their own decision to fly.</p>
  </div>
</div>
<script>
(function () {
  var box = document.getElementById("cards");
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function card(s) {
    if (s.status) {
      var c = el("div", "card soon"), cb = el("div", "body"), ch = el("div", "head");
      c.appendChild(el("div", "top", s.title));
      if (s.camera) { var pic = el("img"); pic.src = s.camera + "?" + Math.floor(Date.now() / 300000); pic.alt = s.title + " camera"; pic.loading = "lazy"; c.appendChild(pic); }
      ch.appendChild(el("span", "chip fair", s.status));
      cb.appendChild(ch);
      if (s.note) cb.appendChild(el("p", "summary", s.note));
      c.appendChild(cb);
      return c;
    }
    var a = el("a", "card"); a.href = "/" + s.page;
    a.appendChild(el("div", "top", s.title));         // site name above the picture (Sam)
    if (s.camera) { var img = el("img"); img.src = "/" + s.page + s.camera; img.alt = s.title + " camera"; img.loading = "lazy"; a.appendChild(img); }
    var b = el("div", "body");
    var h = el("div", "head"); h.appendChild(el("div", "kind", s.kind || ""));
    if (s.chip) h.appendChild(el("span", "chip " + s.chip["class"], s.chip.word));
    b.appendChild(h);
    if (s.summary) b.appendChild(el("p", "summary", s.summary));
    b.appendChild(el("div", "when", "Updated " + (s.updated || "")));
    a.appendChild(b);
    return a;
  }
  function load() {
    fetch("sites.json?" + Date.now(), {cache: "no-store"}).then(function (r) { return r.json(); }).then(function (d) {
      return Promise.all(d.sites.map(function (x) {
        if (!x.summary) return x;                     // a site still being built: listed, no live data
        return fetch(x.summary + "?" + Date.now(), {cache: "no-store"}).then(function (r) { return r.json(); }).catch(function () { return null; });
      }));
    }).then(function (all) {
      box.innerHTML = "";
      all.forEach(function (s) { if (s) box.appendChild(card(s)); });
      if (!box.children.length) box.appendChild(el("p", "summary", "No site summaries could be loaded."));
    }).catch(function () { box.textContent = "The site list could not be loaded."; });
  }
  load();
  setInterval(load, 300000);
})();
</script>
</body>
</html>
